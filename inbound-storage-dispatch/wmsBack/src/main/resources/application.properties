spring.application.name=wms

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/wms_db}
spring.datasource.username=${DB_USERNAME:wms_user}
spring.datasource.password=${DB_PASSWORD:wms_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
wms.mail.from=${MAIL_FROM:noreply@wms.local}

server.address=0.0.0.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

wms.app.url=${WMS_APP_URL:http://localhost:8080}
wms.frontend.url=${WMS_FRONTEND_URL:http://localhost:5173}
wms.cors.allowed-origins=${WMS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://127.0.0.1:80,http://localhost,${wms.frontend.url}}
wms.jwt.cookie-secure=${WMS_JWT_COOKIE_SECURE:false}

wms.cleanup.cron=0 0 2 * * *
wms.cleanup.retention-days=14

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.docker.compose.file=../docker-compose.yaml

wms.jwt.secret=${JWT_SECRET:default_jwt_dev_secret_key_must_be_changed_in_production_32bytes_min}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini-2024-07-18}
spring.ai.openai.chat.temperature=0.2

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
