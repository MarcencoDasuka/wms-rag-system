codebase:
  target_dir: "../inbound-storage-dispatch"
  extensions:
    - ".java"
    - ".vue"
    - ".js"
    - ".sql"
    - ".properties"
    - ".yaml"
    - ".yml"
    - ".md"
  ignore_dirs:
    - "target"
    - "node_modules"
    - ".git"
    - ".idea"
    - ".vscode"
    - "dist"
    - "build"
    - ".system_generated"

embeddings:
  default_model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"

reranking:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 4
  min_score: -3.0

vector_db:
  persist_dir: "data/chroma"
  collection_name: "wms_codebase_knowledge"

retrieval:
  default_top_k: 12
  similarity_threshold: 0.10

server:
  host: "0.0.0.0"
  port: 8000
