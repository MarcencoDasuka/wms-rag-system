services:
  wms-code-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-code-rag-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - WMS_CODEBASE_PATH=/workspace/wms
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - OSPYSIN_DOCS_PATH=/workspace/ospysin-docs
      - OSPYSIN_ENABLED=true
      - OSPYSIN_SOURCE_COMMIT=${OSPYSIN_SOURCE_COMMIT:-}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    volumes:
      # Mount source code as read-only to prevent tampering
      - ./src:/app/src:ro
      # Mount configuration as read-only
      - ./config.yaml:/app/config.yaml:ro
      # Mount WMS codebase as read-only for security and live indexing
      - ../inbound-storage-dispatch:/workspace/wms:ro
      # Mount Ospysin docs as read-only from Desktop repository
      - ../../Ospysin/docs:/workspace/ospysin-docs:ro
      # Persistent vector database storage on host
      - ./data/chroma:/app/data/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M
